name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.14
      - run: uv sync --locked --group dev --group figures --group chemistry
      - run: uv run --locked --group dev --group figures --group chemistry python -m unittest discover -s tests -v
      - run: uv run --locked --group figures --group chemistry python scripts/evaluate_figures.py --output-dir local/figure-evaluation
      - run: uv run --locked --group dev python scripts/validate_repository.py
      - run: uv run --locked --group dev ruff check .
      - run: uv run --locked --group dev ruff format --check .
