[project]
name = "jacs-skills"
version = "0.7.0"
description = "Evidence-grounded JACS writing, scientific figures, and style distillation skills"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["PyYAML>=6.0.2,<7", "ruff>=0.11,<1"]
figures = ["matplotlib>=3.9,<4", "numpy>=1.26,<3", "pillow>=11,<13", "pypdf>=6,<7", "pypdfium2>=4.30,<6", "cairosvg>=2.7,<3", "defusedxml>=0.7,<1", "colorspacious>=1.1.2,<2"]
chemistry = ["rdkit>=2024.9,<2027"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
# Independent forward-test programs are archived as evaluated, apart from path normalization.
extend-exclude = ["evaluation/figures/forward-output", "evaluation/figure-v3/forward-output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
