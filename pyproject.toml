[project]
name = "jacs-skills"
version = "0.1.0"
description = "Evidence-grounded JACS writing, polishing, and style distillation skills"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["PyYAML>=6.0.2,<7", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
